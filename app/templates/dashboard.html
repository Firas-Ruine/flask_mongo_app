{% extends "base.html" %} {% block content %}
<h2 class="text-3xl font-bold mb-6">Dashboard</h2>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <!-- Chart: Subscriber Growth -->
  <div class="bg-white shadow-md rounded-lg p-6">
    <h3 class="text-xl font-semibold mb-4">Subscriber Growth</h3>
    <canvas id="subscriberGrowthChart" class="w-full"></canvas>
  </div>

  <!-- Chart: Active Loans -->
  <div class="bg-white shadow-md rounded-lg p-6">
    <h3 class="text-xl font-semibold mb-4">Active Loans</h3>
    <canvas id="activeLoansChart" class="w-full"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/js/dashboard.js"></script>
{% endblock %}
