{% extends "base.html" %} {% block content %}
<h2 class="text-2xl font-bold mb-6">Create Loan</h2>
<div class="bg-white shadow-md rounded-lg p-6">
  <form id="loan-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Subscriber Dropdown -->
    <select id="subscriber_id" required class="p-2 border rounded">
      <option value="">Select Subscriber</option>
      <!-- Options will be populated dynamically -->
    </select>

    <!-- Document Dropdown -->
    <select id="document_id" required class="p-2 border rounded">
      <option value="">Select Document</option>
      <!-- Options will be populated dynamically -->
    </select>

    <!-- Loan Status Dropdown -->
    <select id="status" required class="p-2 border rounded col-span-full">
      <option value="">Select Status</option>
      <option value="Pending">Pending</option>
      <option value="Approved">Approved</option>
      <option value="Returned">Returned</option>
    </select>

    <!-- Due Date -->
    <label for="due_date" class="block col-span-full">Due Date</label>
    <input
      type="date"
      id="due_date"
      required
      class="p-2 border rounded col-span-full"
    />

    <!-- Return Date -->
    <label for="return_date" class="block col-span-full"
      >Return Date (Optional)</label
    >
    <input
      type="date"
      id="return_date"
      class="p-2 border rounded col-span-full"
    />

    <button
      type="submit"
      class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 col-span-full"
    >
      Create
    </button>
  </form>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/loans_create.js"></script>
{% endblock %}
