<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Library Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Sidebar toggle for mobile
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("hidden");
      }
    </script>
  </head>
  <body class="bg-gray-100 flex">
    <!-- Sidebar -->
    <aside
      id="sidebar"
      class="w-64 bg-gray-800 text-white h-screen hidden md:block"
    >
      <div class="p-4">
        <h2 class="text-xl font-bold">Media Library</h2>
      </div>
      <nav class="mt-6">
        <ul class="space-y-2">
          <!-- Dashboard -->
          <li>
            <a href="/dashboard" class="block py-2 px-4 hover:bg-gray-700"
              >Dashboard</a
            >
          </li>

          <!-- Subscribers -->
          <li>
            <a
              href="/subscribers/create"
              class="block py-2 px-4 hover:bg-gray-700"
              >Create Subscriber</a
            >
          </li>
          <li>
            <a
              href="/subscribers/list"
              class="block py-2 px-4 hover:bg-gray-700"
              >List Subscribers</a
            >
          </li>

          <!-- Documents -->
          <li>
            <a
              href="/documents/create"
              class="block py-2 px-4 hover:bg-gray-700"
              >Create Document</a
            >
          </li>
          <li>
            <a href="/documents/list" class="block py-2 px-4 hover:bg-gray-700"
              >List Documents</a
            >
          </li>

          <!-- Loans -->
          <li>
            <a href="/loans/create" class="block py-2 px-4 hover:bg-gray-700"
              >Create Loan</a
            >
          </li>
          <li>
            <a href="/loans/list" class="block py-2 px-4 hover:bg-gray-700"
              >List Loans</a
            >
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Mobile Menu Button -->
    <div class="md:hidden p-4 bg-gray-800 text-white">
      <button onclick="toggleSidebar()" class="flex items-center space-x-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16m-7 6h7"
          />
        </svg>
        <span>Menu</span>
      </button>
    </div>

    <!-- Main Content -->
    <main class="flex-1 p-6">{% block content %}{% endblock %}</main>
  </body>
</html>
