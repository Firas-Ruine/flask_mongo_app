networks:
  app_network:
    external: true

volumes:
  flask_logs:
  mongodb_router1_data:
  mongodb_router2_data:
  mongodb_config1_data:
  mongodb_config2_data:
  mongodb_config3_data:
  mongodb_shard1_node1_data:
  mongodb_shard1_node2_data:
  mongodb_shard1_node3_data:
  mongodb_shard2_node1_data:
  mongodb_shard2_node2_data:
  mongodb_shard2_node3_data:

services:
  # Flask Application
  flask_api:
    build:
      context: .
      dockerfile: docker/flask/Dockerfile
    container_name: flask_api_service
    ports:
      - "5001:5000"
    env_file:
      - .env
    networks:
      - app_network
    depends_on:
      - mongodb_router1
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: always

  # MongoDB Initializer
  init-mongo:
    image: bash:latest
    container_name: mongo_initializer
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      - mongodb_router1
    command: >
      bash -c "
      chmod +x /app/scripts/init/*.sh /app/scripts/replication/*.sh /app/scripts/utils/*.sh &&
      /app/scripts/init/config_servers.sh &&
      /app/scripts/init/shard_servers.sh &&
      /app/scripts/init/add_shards.sh &&
      /app/scripts/replication/set_priorities.sh
      "
    networks:
      - app_network
    restart: "no"

  # MongoDB Routers
  mongodb_router1:
    build:
      context: .
      dockerfile: docker/mongodb/Dockerfile
    container_name: mongodb_router1
    command: mongos --port 27017 --configdb rs-config/mongodb_config1:27017,mongodb_config2:27017,mongodb_config3:27017 --bind_ip_all
    ports:
      - "27117:27017"
    networks:
      - app_network
    volumes:
      - mongodb_router1_data:/data/db
    restart: always

  mongodb_router2:
    build:
      context: .
      dockerfile: docker/mongodb/Dockerfile
    container_name: mongodb_router2
    command: mongos --port 27017 --configdb rs-config/mongodb_config1:27017,mongodb_config2:27017,mongodb_config3:27017 --bind_ip_all
    ports:
      - "27118:27017"
    networks:
      - app_network
    volumes:
      - mongodb_router2_data:/data/db
    restart: always

  # MongoDB Config Servers
  mongodb_config1:
    image: mongo:latest
    container_name: mongodb_config1
    command: mongod --port 27017 --configsvr --replSet rs-config
    networks:
      - app_network
    volumes:
      - mongodb_config1_data:/data/db
    restart: always

  mongodb_config2:
    image: mongo:latest
    container_name: mongodb_config2
    command: mongod --port 27017 --configsvr --replSet rs-config
    networks:
      - app_network
    volumes:
      - mongodb_config2_data:/data/db
    restart: always

  mongodb_config3:
    image: mongo:latest
    container_name: mongodb_config3
    command: mongod --port 27017 --configsvr --replSet rs-config
    networks:
      - app_network
    volumes:
      - mongodb_config3_data:/data/db
    restart: always

  # MongoDB Shard 1
  mongodb_shard1_node1:
    image: mongo:latest
    container_name: mongodb_shard1_node1
    command: mongod --port 27017 --shardsvr --replSet rs-shard1
    networks:
      - app_network
    volumes:
      - mongodb_shard1_node1_data:/data/db
    restart: always

  mongodb_shard1_node2:
    image: mongo:latest
    container_name: mongodb_shard1_node2
    command: mongod --port 27017 --shardsvr --replSet rs-shard1
    networks:
      - app_network
    volumes:
      - mongodb_shard1_node2_data:/data/db
    restart: always

  mongodb_shard1_node3:
    image: mongo:latest
    container_name: mongodb_shard1_node3
    command: mongod --port 27017 --shardsvr --replSet rs-shard1
    networks:
      - app_network
    volumes:
      - mongodb_shard1_node3_data:/data/db
    restart: always

  # MongoDB Shard 2
  mongodb_shard2_node1:
    image: mongo:latest
    container_name: mongodb_shard2_node1
    command: mongod --port 27017 --shardsvr --replSet rs-shard2
    networks:
      - app_network
    volumes:
      - mongodb_shard2_node1_data:/data/db
    restart: always

  mongodb_shard2_node2:
    image: mongo:latest
    container_name: mongodb_shard2_node2
    command: mongod --port 27017 --shardsvr --replSet rs-shard2
    networks:
      - app_network
    volumes:
      - mongodb_shard2_node2_data:/data/db
    restart: always

  mongodb_shard2_node3:
    image: mongo:latest
    container_name: mongodb_shard2_node3
    command: mongod --port 27017 --shardsvr --replSet rs-shard2
    networks:
      - app_network
    volumes:
      - mongodb_shard2_node3_data:/data/db
    restart: always
